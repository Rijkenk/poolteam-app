name: CueScore bijwerken

on:
  schedule:
    - cron: "17 * * * *"   # elk uur
  push:
    paths: ["teams/**", "app/**", "scripts/**", ".github/workflows/cuescore.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: cuescore, cancel-in-progress: false }

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Gegevens ophalen
        run: node scripts/update-cuescore.mjs
      - name: Teampagina's bouwen
        run: node scripts/build.mjs
      - name: Opslaan als er iets veranderd is
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Geen wijzigingen"; exit 0; fi
          git config user.name "cuescore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CueScore-gegevens bijgewerkt"
          git push
      - name: Database wakker houden (gratis Supabase pauzeert na een week zonder gebruik)
        if: always()
        run: |
          U=$(grep -o 'supabaseUrl: *"[^"]*"' config.js | cut -d'"' -f2); K=$(grep -o 'supabaseKey: *"[^"]*"' config.js | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $K" -H "Authorization: Bearer $K" "$U/rest/v1/opgaves?select=match&limit=1")
          echo "Supabase antwoordde met $code"
