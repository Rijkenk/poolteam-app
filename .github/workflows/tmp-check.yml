name: tmp check
on: { push: { paths: [".github/workflows/tmp-check.yml"] } }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://itccbxepuevwwsxdriqy.supabase.co; K=sb_publishable_PGowq3YpHdObHB5V0h12FQ__OKs2RAt
          H=(-H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json")
          echo "opgaves witchcraft: $(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" "$U/rest/v1/opgaves?team=eq.witchcraft&select=team")"
          echo "opgaves bod count: $(curl -s "${H[@]}" "$U/rest/v1/opgaves?team=eq.ballofduty&select=match" | jq length)"
          echo "check_player_t wrong: $(curl -s "${H[@]}" -X POST "$U/rest/v1/rpc/check_player_t" -d '{"p_team":"witchcraft","p_player":"1160908","p_code":"XXXXXX"}')"
          echo "set_opgave_t wrong: $(curl -s "${H[@]}" -X POST "$U/rest/v1/rpc/set_opgave_t" -d '{"p_team":"witchcraft","p_code":"XXXXXX","p_match":27,"p_player":"1160908","p_status":"ja","p_prefs":[]}' | jq -c .message)"
          echo "old check_player: $(curl -s "${H[@]}" -X POST "$U/rest/v1/rpc/check_player" -d '{"p_player":"1162921","p_code":"XXXXXX"}')"
          echo "spelers readable: $(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" "$U/rest/v1/spelers?select=code")"
          echo "pages: $(curl -s -o /dev/null -w '%{http_code}' https://rijkenk.github.io/poolteam-app/witchcraft/)"
