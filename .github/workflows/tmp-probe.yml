name: tmp probe
on: { push: { paths: [".github/workflows/tmp-probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmpprobe
          curl -sS -D tmpprobe/sub.hdr "https://api.cuescore.com/match/sub/all/?tournamentId=83574430" -o tmpprobe/sub.json; echo "sub $(wc -c < tmpprobe/sub.json)"
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmpprobe && git commit -qm probe2 && git push
