name: tmp probe
on: { push: { paths: [".github/workflows/tmp-probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmpprobe
          curl -sS "https://api.cuescore.com/match/?id=88313743" -o tmpprobe/match.json; echo "match $(wc -c < tmpprobe/match.json)"
          curl -sS "https://api.cuescore.com/match/?matchId=88313743" -o tmpprobe/match2.json; echo "match2 $(wc -c < tmpprobe/match2.json)"
          curl -sSL "https://cuescore.com/tournament/Pool+Overijssel+Eerste+Klasse+2026%252F2027/83574430" -o tmpprobe/t.html; echo "html $(wc -c < tmpprobe/t.html)"
          curl -sSL "https://cuescore.com/match/?matchId=88313743" -o tmpprobe/m.html; echo "mhtml $(wc -c < tmpprobe/m.html)"
          curl -sSL "https://cuescore.com/team/Witchcraft/1176555" -o tmpprobe/team.html; echo "team $(wc -c < tmpprobe/team.html)"
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmpprobe && git commit -qm probe && git push
