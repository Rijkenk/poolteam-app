name: tmp probe
on: { push: { paths: [".github/workflows/tmp-probe.yml"] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmpprobe
          curl -sSL "https://cuescore.com/tournament/Pool+Overijssel+Eerste+Klasse+2026%252F2027/83574430/mvp" -o tmpprobe/mvp.html; echo "mvp $(wc -c < tmpprobe/mvp.html)"
          curl -sSL "https://cuescore.com/js/cuescore.min-1.93.js" -o tmpprobe/cs.js; echo "js $(wc -c < tmpprobe/cs.js)"
          curl -sSL "https://cuescore.com/js/cs/cs.min-1.93.js" -o tmpprobe/cs2.js; echo "js2 $(wc -c < tmpprobe/cs2.js)"
          curl -sSL "https://api.cuescore.com/js/CueScore.min-4.02.js" -o tmpprobe/api.js; echo "apijs $(wc -c < tmpprobe/api.js)"
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmpprobe && git commit -qm probe2 && git push
